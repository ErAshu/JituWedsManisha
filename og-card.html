<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:wght@600&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:
 radial-gradient(circle at 30% 50%,rgba(231,181,74,.18),transparent 55%),linear-gradient(135deg,#7a1218,#4a080c);
 font-family:"Cormorant Garamond",serif;color:#fff1b8;position:relative}
.frame{position:absolute;inset:18px;border:3px solid #e7b54a;border-radius:18px;outline:1px solid rgba(255,241,184,.5);outline-offset:-12px}
.photo{position:absolute;right:46px;top:46px;width:540px;height:538px;border-radius:270px 270px 20px 20px;overflow:hidden;
 box-shadow:0 0 0 6px #e7b54a,0 0 0 12px #5a0d12,0 0 0 14px #e7b54a,0 20px 40px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:46% 22%}
.text{position:absolute;left:60px;top:0;bottom:0;width:540px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.om{font-family:"Tiro Devanagari Hindi";font-size:34px;color:#ffcc33}
.sub{font-family:"Cinzel Decorative";font-size:22px;letter-spacing:6px;margin:14px 0 4px;color:#ffcc33}
.n{font-family:"Great Vibes";font-size:104px;line-height:1.05;background:linear-gradient(110deg,#a86b12,#e7b54a 35%,#fff8d6 50%,#e7b54a 65%,#a86b12);
 -webkit-background-clip:text;color:transparent;padding:.1em .7em;margin:-.1em -.5em}
.amp{font-family:"Great Vibes";font-size:54px;color:#ffcc33;line-height:.8}
.date{margin-top:18px;font-family:"Cinzel Decorative";font-size:30px;letter-spacing:3px}
.hi{font-family:"Tiro Devanagari Hindi";font-size:26px;margin-top:6px;color:#fff6d8}
.line{width:300px;height:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,#e7b54a,transparent)}
</style></head><body>
<div class="frame"></div>
<div class="photo"><img src="images/couple.jpg"></div>
<div class="text">
 <div class="om">॥ श्री गणेशाय नमः ॥</div>
 <div class="sub">SHUBH VIVAH</div>
 <div class="n">Jitendra</div><div class="amp">&amp;</div><div class="n">Manisha</div>
 <div class="line"></div>
 <div class="date">10 · 12 · 2026</div>
 <div class="hi">राँची, झारखण्ड</div>
</div>
</body></html>
